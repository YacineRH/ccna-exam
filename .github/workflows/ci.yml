name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: examforge
          POSTGRES_PASSWORD: examforge
          POSTGRES_DB: examforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://examforge:examforge@localhost:5432/examforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (moteur, contenu, API sur PostgreSQL, MCP, web)
        run: pnpm test

  e2e:
    name: Tests navigateur (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: examforge
          POSTGRES_PASSWORD: examforge
          POSTGRES_DB: examforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://examforge:examforge@localhost:5432/examforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (API et front servis par la suite)
        run: pnpm build
      - name: Chromium pour Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Parcours e2e (inscription, ordre, association, examen, lab CLI, mobile)
        run: pnpm e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  sweep:
    name: Balayage à 390 px de toute la banque (non bloquant)
    runs-on: ubuntu-latest
    # Long et purement visuel : un échec est signalé sans bloquer la fusion.
    continue-on-error: true
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: examforge
          POSTGRES_PASSWORD: examforge
          POSTGRES_DB: examforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://examforge:examforge@localhost:5432/examforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (API et front servis par le balayage)
        run: pnpm build
      - name: Chromium pour Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Toutes les questions à 390 px, pendant la tentative et dans le post-mortem
        run: pnpm e2e:sweep
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sweep
          path: |
            e2e/playwright-report-sweep/
            e2e/test-results/
          retention-days: 7

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
